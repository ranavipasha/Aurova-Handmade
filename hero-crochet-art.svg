<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <filter id="hero-shadow" x="-10%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3C332E" flood-opacity="0.11"/>
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F2EBE0"/>
      <stop offset="100%" stop-color="#E9DFD1"/>
    </linearGradient>
    <linearGradient id="hero-blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6D2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D9B7B2" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="hero-sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4B7A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#82957E" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bag-cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#E6DCCE"/>
    </linearGradient>
    <linearGradient id="bag-rose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4ABA5"/>
      <stop offset="100%" stop-color="#B98F8B"/>
    </linearGradient>
    <pattern id="crochet-mesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 C4 3, 12 3, 16 8 C12 13, 4 13, 0 8" fill="none" stroke="#BA9F95" stroke-width="1.3" opacity="0.45"/>
      <circle cx="8" cy="8" r="1.5" fill="#A88B81" opacity="0.4"/>
    </pattern>
    <pattern id="shell-stitch" width="24" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 Q6 2 12 14 Q18 2 24 14" fill="none" stroke="#C5AFA5" stroke-width="1.4" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="700" fill="url(#hero-bg)"/>
  <circle cx="280" cy="240" r="190" fill="url(#hero-blush)" filter="url(#soft-blur)"/>
  <ellipse cx="640" cy="420" rx="220" ry="160" fill="url(#hero-sage)" filter="url(#soft-blur)"/>
  <path d="M120 180 C200 80, 420 120, 500 240 C560 330, 440 480, 320 460 C200 440, 60 260, 120 180 Z" fill="#EFE6DA" opacity="0.6"/>
  <path d="M420 580 V 220 A 140 140 0 0 1 700 220 V 580 Z" fill="#E8DED1" opacity="0.45"/>

  <ellipse cx="610" cy="540" rx="70" ry="18" fill="#3C332E" opacity="0.08"/>
  <ellipse cx="370" cy="565" rx="160" ry="26" fill="#3C332E" opacity="0.11"/>

  <g id="ceramic-vase">
    <path d="M575 350 C560 410, 550 480, 570 535 C580 545, 640 545, 650 535 C670 480, 660 410, 645 350 Z" fill="#D6C5B8" filter="url(#hero-shadow)"/>
    <ellipse cx="610" cy="350" rx="35" ry="10" fill="#C2B0A2"/>
    <path d="M565 390 C530 400, 525 470, 560 480" fill="none" stroke="#D6C5B8" stroke-width="12" stroke-linecap="round"/>
    <path d="M605 345 Q590 220 540 140" fill="none" stroke="#7A8B77" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M615 345 Q630 200 680 130" fill="none" stroke="#968377" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M610 345 Q615 240 610 160" fill="none" stroke="#8A9A86" stroke-width="2" stroke-linecap="round"/>
    <circle cx="538" cy="138" r="8" fill="#D9B7B2" opacity="0.85"/>
    <circle cx="682" cy="128" r="7" fill="#B98F8B" opacity="0.85"/>
    <path d="M605 160 Q590 150 610 140 Q630 150 610 160 Z" fill="#8A9A86" opacity="0.8"/>
  </g>

  <g id="crochet-tote" filter="url(#hero-shadow)">
    <path d="M300 340 C300 180, 440 180, 440 340" fill="none" stroke="#C59E9A" stroke-width="18" stroke-linecap="round"/>
    <path d="M300 340 C300 180, 440 180, 440 340" fill="none" stroke="#FAF5EE" stroke-width="12" stroke-linecap="round"/>
    <path d="M300 340 C300 180, 440 180, 440 340" fill="none" stroke="#B98F8B" stroke-width="3" stroke-dasharray="6 6"/>

    <path d="M230 350 C220 440, 225 530, 260 555 C295 570, 445 570, 480 555 C515 530, 520 440, 510 350 C440 365, 300 365, 230 350 Z" fill="url(#bag-cream)"/>
    <path d="M230 350 C220 440, 225 530, 260 555 C295 570, 445 570, 480 555 C515 530, 520 440, 510 350 C440 365, 300 365, 230 350 Z" fill="url(#crochet-mesh)"/>

    <path d="M245 470 C240 515, 255 545, 275 558 C300 568, 440 568, 465 558 C485 545, 500 515, 495 470 Z" fill="url(#bag-rose)" opacity="0.92"/>
    <path d="M245 470 C240 515, 255 545, 275 558 C300 568, 440 568, 465 558 C485 545, 500 515, 495 470 Z" fill="url(#shell-stitch)"/>

    <path d="M230 350 Q245 342 260 352 Q275 342 290 352 Q305 342 320 352 Q335 342 350 352 Q365 342 380 352 Q395 342 410 352 Q425 342 440 352 Q455 342 470 352 Q485 342 500 352 Q505 345 510 350" fill="none" stroke="#B98F8B" stroke-width="4.5" stroke-linecap="round"/>

    <rect x="355" y="420" width="30" height="16" rx="4" fill="#C5A47E" opacity="0.9"/>
    <circle cx="360" cy="428" r="1.5" fill="#3C332E"/>
    <circle cx="380" cy="428" r="1.5" fill="#3C332E"/>
  </g>

  <g id="crochet-flowers" filter="url(#hero-shadow)">
    <g transform="translate(190, 520)">
      <circle cx="0" cy="0" r="38" fill="#B98F8B"/>
      <path d="M-30 -10 C-35 -25, -15 -35, 0 -30 C15 -35, 35 -25, 30 -10 C35 10, 20 30, 0 32 C-20 30, -35 10, -30 -10 Z" fill="#D9B7B2"/>
      <path d="M-22 -8 C-25 -18, -10 -24, 0 -20 C10 -24, 25 -18, 22 -8 C25 8, 14 20, 0 22 C-14 20, -25 8, -22 -8 Z" fill="#FAF4EF"/>
      <circle cx="0" cy="0" r="12" fill="#B98F8B"/>
      <circle cx="0" cy="0" r="7" fill="#8A6E63"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FAF4EF" stroke-width="2" stroke-dasharray="3 4"/>
    </g>

    <g transform="translate(540, 570)">
      <ellipse cx="-18" cy="0" rx="14" ry="7" fill="#FFFFFF"/>
      <ellipse cx="18" cy="0" rx="14" ry="7" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#FFFFFF"/>
      <ellipse cx="0" cy="18" rx="7" ry="14" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="11" fill="#D4A76A"/>
      <circle cx="0" cy="0" r="7" fill="#B88A4F"/>
    </g>

    <path d="M150 560 Q120 550 130 530 Q150 535 150 560 Z" fill="#8A9A86" opacity="0.85"/>
    <path d="M225 565 Q250 580 235 595 Q215 580 225 565 Z" fill="#A2B29E" opacity="0.8"/>
  </g>

  <g id="yarn-thread">
    <path d="M140 600 C 180 630, 260 590, 310 620 C 370 655, 460 620, 520 645 C 600 680, 720 630, 780 650" fill="none" stroke="#D9B7B2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="gallery-typography" opacity="0.75">
    <text x="60" y="650" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" fill="#3C332E" letter-spacing="3">AUROVA ATELIER</text>
    <text x="60" y="668" font-family="'DM Sans', sans-serif" font-size="10" fill="#7A6D65" letter-spacing="1.5">PIECE NO. 01 — SAC ÉDITORIAL EN COTON ET NATURE MORTE</text>
    <line x1="60" y1="632" x2="160" y2="632" stroke="#B98F8B" stroke-width="1"/>
  </g>
  <rect x="25" y="25" width="850" height="650" fill="none" stroke="#3C332E" stroke-width="1" opacity="0.12"/>
</svg>