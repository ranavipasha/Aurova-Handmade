<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <filter id="toy-sh" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="#FFFFFF"/>

  <!-- Playful stars & doodles from reference -->
  <path d="M90 70 L98 88 L118 90 L104 102 L108 122 L90 110 L72 122 L76 102 L62 90 L82 88 Z" 
        fill="#FFD54F" stroke="#FFA000" stroke-width="1.8"/>
  <path d="M490 80 L500 100 L520 102 L505 115 L510 135 L490 122 L470 135 L475 115 L460 102 L480 100 Z" 
        fill="#FFCA28" stroke="#F57C00" stroke-width="1.8"/>

  <!-- Golden egg doodle on right -->
  <g transform="translate(480, 220)" filter="url(#toy-sh)">
    <path d="M30 8 C48 6, 62 16, 65 32 C68 48, 55 62, 38 60 C20 58, 8 50, 7 35 C6 20, 15 10, 30 8 Z" 
          fill="#F7F7F7" stroke="#E0DACB" stroke-width="2"/>
    <circle cx="36" cy="34" r="14" fill="#FF9E1B"/>
    <circle cx="32" cy="30" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- HEIRLOOM AMIGURUMI BUNNY PLUSH (Centerpiece) -->
  <g id="bunny-plush" transform="translate(200, 50)" filter="url(#toy-sh)">
    
    <!-- Floppy Bunny Ears -->
    <!-- Left Ear -->
    <path d="M50 170 C25 60, 0 40, -10 60 C-20 85, 20 180, 45 190 Z" 
          fill="#FAF4EF" stroke="#8D6E63" stroke-width="2.5"/>
    <path d="M42 160 C25 80, 5 60, -2 75 C-8 95, 20 170, 40 180 Z" 
          fill="#F8BBD0" opacity="0.7"/>

    <!-- Right Ear -->
    <path d="M150 170 C175 60, 200 40, 210 60 C220 85, 180 180, 155 190 Z" 
          fill="#FAF4EF" stroke="#8D6E63" stroke-width="2.5"/>
    <path d="M158 160 C175 80, 195 60, 202 75 C208 95, 180 170, 160 180 Z" 
          fill="#F8BBD0" opacity="0.7"/>

    <!-- Bunny Body (Lower Amigurumi sphere) -->
    <circle cx="100" cy="310" r="85" fill="#FAF4EF" stroke="#8D6E63" stroke-width="2.5"/>
    <!-- Textured single crochet stitch rows -->
    <circle cx="100" cy="310" r="72" fill="none" stroke="#D7CCC8" stroke-width="1.8" stroke-dasharray="4 4"/>
    <circle cx="100" cy="310" r="54" fill="none" stroke="#D7CCC8" stroke-width="1.8" stroke-dasharray="4 4"/>

    <!-- Dusty Rose Crochet Neck Ruff / Ruffled Collar -->
    <g id="neck-collar">
      <path d="M30 230 
               Q45 210 60 230 Q75 210 90 230 Q105 210 120 230 Q135 210 150 230 Q165 210 170 240 
               Q150 255 135 240 Q120 255 105 240 Q90 255 75 240 Q60 255 45 240 Q30 250 30 230 Z" 
            fill="#F48FB1" stroke="#C2185B" stroke-width="2.5"/>
    </g>

    <!-- Bunny Head (Upper sphere) -->
    <circle cx="100" cy="190" r="68" fill="#FAF4EF" stroke="#8D6E63" stroke-width="2.5"/>
    <circle cx="100" cy="190" r="56" fill="none" stroke="#D7CCC8" stroke-width="1.8" stroke-dasharray="4 4"/>

    <!-- Sleepy Embroidered Curved Eyelashes -->
    <path d="M62 185 Q72 195 82 185" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="192" x2="65" y2="197" stroke="#3E2723" stroke-width="2.2" stroke-linecap="round"/>

    <path d="M118 185 Q128 195 138 185" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="192" x2="135" y2="197" stroke="#3E2723" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Soft Blush Cheeks -->
    <ellipse cx="64" cy="202" rx="12" ry="7" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="136" cy="202" rx="12" ry="7" fill="#FF8A80" opacity="0.6"/>

    <!-- Embroidered Nose & Mouth -->
    <path d="M96 198 L104 198 L100 204 Z" fill="#E91E63"/>
    <path d="M100 204 V 212 M100 212 Q94 216 88 213 M100 212 Q106 216 112 213" 
          fill="none" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>

    <!-- Little Paws holding a miniature crochet daisy -->
    <ellipse cx="60" cy="310" rx="18" ry="14" fill="#FAF4EF" stroke="#8D6E63" stroke-width="2"/>
    <ellipse cx="140" cy="310" rx="18" ry="14" fill="#FAF4EF" stroke="#8D6E63" stroke-width="2"/>

    <circle cx="100" cy="310" r="14" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.5"/>
    <circle cx="100" cy="310" r="7" fill="#FFCA28"/>
  </g>
</svg>