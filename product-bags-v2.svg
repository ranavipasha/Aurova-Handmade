<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <filter id="ink-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111111" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="red-marker-light" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#E52B2B"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="red-highlight" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="60%" stop-color="#EF3E3E"/>
      <stop offset="100%" stop-color="#C62828"/>
    </radialGradient>
  </defs>

  <rect width="600" height="650" fill="#FFFFFF"/>

  <!-- Vintage studio circular stamp on left (like reference 'GOOD OBJECTS' stamp) -->
  <g transform="translate(110, 190)" opacity="0.45">
    <circle cx="45" cy="45" r="42" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 3"/>
    <circle cx="45" cy="45" r="38" fill="none" stroke="#222222" stroke-width="0.8"/>
    <text x="45" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" letter-spacing="2" fill="#222222" text-anchor="middle">AUROVA</text>
    <line x1="28" y1="52" x2="62" y2="35" stroke="#222222" stroke-width="1"/>
    <text x="35" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#222222">A</text>
    <text x="50" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#222222">H</text>
    <text x="45" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" letter-spacing="1" fill="#222222" text-anchor="middle">HANDMADE</text>
  </g>

  <!-- CHUNKY RED CROCHET SHOULDER BAG -->
  <g id="chunky-red-bag" filter="url(#ink-shadow)">
    <!-- Handle Arch Bobbles -->
    <g fill="url(#red-marker-light)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="205" cy="285" rx="20" ry="15" transform="rotate(-15 205 285)"/>
      <ellipse cx="220" cy="245" rx="19" ry="15" transform="rotate(-35 220 245)"/>
      <ellipse cx="240" cy="210" rx="18" ry="15" transform="rotate(-50 240 210)"/>
      <ellipse cx="265" cy="185" rx="18" ry="15" transform="rotate(-65 265 185)"/>
      <ellipse cx="300" cy="175" rx="18" ry="15"/>
      <ellipse cx="335" cy="185" rx="18" ry="15" transform="rotate(65 335 185)"/>
      <ellipse cx="360" cy="210" rx="18" ry="15" transform="rotate(50 360 210)"/>
      <ellipse cx="380" cy="245" rx="19" ry="15" transform="rotate(35 380 245)"/>
      <ellipse cx="395" cy="285" rx="20" ry="15" transform="rotate(15 395 285)"/>
      <ellipse cx="405" cy="320" rx="21" ry="16"/>
      <ellipse cx="410" cy="350" rx="22" ry="16"/>
      <ellipse cx="415" cy="380" rx="22" ry="16"/>
      <ellipse cx="420" cy="415" rx="23" ry="16"/>
      <ellipse cx="195" cy="320" rx="21" ry="16"/>
      <ellipse cx="190" cy="350" rx="22" ry="16"/>
      <ellipse cx="185" cy="380" rx="22" ry="16"/>
      <ellipse cx="180" cy="415" rx="23" ry="16"/>
    </g>

    <!-- Main Bag Body: Rows of Chunky Stitches -->
    <g fill="url(#red-highlight)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="205" cy="425" rx="20" ry="15"/>
      <ellipse cx="235" cy="428" rx="20" ry="15"/>
      <ellipse cx="265" cy="430" rx="20" ry="15"/>
      <ellipse cx="335" cy="430" rx="20" ry="15"/>
      <ellipse cx="365" cy="428" rx="20" ry="15"/>
      <ellipse cx="395" cy="425" rx="20" ry="15"/>
    </g>
    <g fill="url(#red-marker-light)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="170" cy="445" rx="21" ry="16"/><ellipse cx="198" cy="448" rx="20" ry="16"/>
      <ellipse cx="228" cy="450" rx="20" ry="16"/><ellipse cx="258" cy="452" rx="20" ry="16"/>
      <ellipse cx="288" cy="452" rx="20" ry="16"/><ellipse cx="318" cy="452" rx="20" ry="16"/>
      <ellipse cx="348" cy="450" rx="20" ry="16"/><ellipse cx="378" cy="448" rx="20" ry="16"/>
      <ellipse cx="408" cy="448" rx="20" ry="16"/><ellipse cx="430" cy="445" rx="21" ry="16"/>
    </g>
    <g fill="url(#red-highlight)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="165" cy="475" rx="21" ry="16"/><ellipse cx="195" cy="478" rx="20" ry="16"/>
      <ellipse cx="225" cy="480" rx="20" ry="16"/><ellipse cx="255" cy="482" rx="20" ry="16"/>
      <ellipse cx="285" cy="482" rx="20" ry="16"/><ellipse cx="315" cy="482" rx="20" ry="16"/>
      <ellipse cx="345" cy="480" rx="20" ry="16"/><ellipse cx="375" cy="478" rx="20" ry="16"/>
      <ellipse cx="405" cy="478" rx="20" ry="16"/><ellipse cx="435" cy="475" rx="21" ry="16"/>
    </g>
    <g fill="url(#red-marker-light)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="160" cy="505" rx="21" ry="16"/><ellipse cx="190" cy="508" rx="20" ry="16"/>
      <ellipse cx="220" cy="510" rx="20" ry="16"/><ellipse cx="250" cy="512" rx="20" ry="16"/>
      <ellipse cx="280" cy="512" rx="20" ry="16"/><ellipse cx="310" cy="512" rx="20" ry="16"/>
      <ellipse cx="340" cy="510" rx="20" ry="16"/><ellipse cx="370" cy="508" rx="20" ry="16"/>
      <ellipse cx="400" cy="508" rx="20" ry="16"/><ellipse cx="430" cy="508" rx="20" ry="16"/>
      <ellipse cx="440" cy="505" rx="21" ry="16"/>
    </g>
    <g fill="url(#red-highlight)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="155" cy="535" rx="21" ry="15"/><ellipse cx="185" cy="538" rx="20" ry="15"/>
      <ellipse cx="215" cy="540" rx="20" ry="15"/><ellipse cx="245" cy="542" rx="20" ry="15"/>
      <ellipse cx="275" cy="542" rx="20" ry="15"/><ellipse cx="305" cy="542" rx="20" ry="15"/>
      <ellipse cx="335" cy="540" rx="20" ry="15"/><ellipse cx="365" cy="538" rx="20" ry="15"/>
      <ellipse cx="395" cy="538" rx="20" ry="15"/><ellipse cx="425" cy="538" rx="20" ry="15"/>
      <ellipse cx="445" cy="535" rx="21" ry="15"/>
    </g>

    <!-- White Highlights & Gaps -->
    <g fill="#FFFFFF" opacity="0.6">
      <ellipse cx="205" cy="282" rx="8" ry="3"/><ellipse cx="240" cy="207" rx="7" ry="3"/>
      <ellipse cx="300" cy="172" rx="7" ry="3"/><ellipse cx="360" cy="207" rx="7" ry="3"/>
      <ellipse cx="395" cy="282" rx="8" ry="3"/><ellipse cx="225" cy="476" rx="8" ry="3"/>
      <ellipse cx="285" cy="478" rx="8" ry="3"/><ellipse cx="345" cy="476" rx="8" ry="3"/>
      <ellipse cx="245" cy="538" rx="8" ry="3"/><ellipse cx="335" cy="536" rx="8" ry="3"/>
    </g>

    <!-- Minimal White Cloth Tag in Center -->
    <g transform="translate(265, 415)">
      <rect x="0" y="0" width="70" height="34" rx="4" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="2"/>
      <text x="35" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#1A1A1A" text-anchor="middle">SOLEIL</text>
    </g>
  </g>
</svg>