<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <defs>
    <filter id="about-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3C332E" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EDE2D2"/>
    </linearGradient>
    <linearGradient id="yarn-skein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BDB8"/>
      <stop offset="50%" stop-color="#C59E99"/>
      <stop offset="100%" stop-color="#A57873"/>
    </linearGradient>
    <pattern id="knit-rib" width="8" height="16" patternUnits="userSpaceOnUse">
      <line x1="4" y1="0" x2="4" y2="16" stroke="#9A6F6A" stroke-width="1.2" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="700" height="550" fill="url(#about-bg)"/>
  <path d="M100 80 Q320 20 480 90 Q620 160 580 340 Q540 480 340 470 Q140 460 90 320 Z" fill="#F3E9DD" opacity="0.8"/>
  <circle cx="480" cy="220" r="140" fill="#D9B7B2" opacity="0.25"/>
  <circle cx="220" cy="360" r="110" fill="#8A9A86" opacity="0.18"/>

  <ellipse cx="350" cy="410" rx="190" ry="35" fill="#3C332E" opacity="0.08"/>
  
  <g id="ceramic-bowl" filter="url(#about-shadow)">
    <path d="M200 290 C210 390, 490 390, 500 290 Z" fill="#E6D7CB"/>
    <ellipse cx="350" cy="290" rx="150" ry="24" fill="#DAC7BA"/>
    <ellipse cx="350" cy="290" rx="140" ry="19" fill="#C5B0A2"/>
  </g>

  <g id="yarn-ball" filter="url(#about-shadow)">
    <ellipse cx="330" cy="275" rx="90" ry="60" fill="url(#yarn-skein)"/>
    <ellipse cx="330" cy="275" rx="90" ry="60" fill="url(#knit-rib)"/>
    <path d="M250 260 Q330 230 410 260" fill="none" stroke="#F5E4E1" stroke-width="3" opacity="0.8"/>
    <path d="M260 285 Q330 255 405 285" fill="none" stroke="#F5E4E1" stroke-width="2.5" opacity="0.8"/>
    <path d="M280 305 Q335 280 390 305" fill="none" stroke="#FAF2F0" stroke-width="2" opacity="0.8"/>
    <path d="M310 220 L355 220 L345 330 L300 330 Z" fill="#FAF6F0" opacity="0.95"/>
    <text x="312" y="275" font-family="'DM Sans', sans-serif" font-size="8" fill="#3C332E" letter-spacing="1.5" transform="rotate(-85 312 275)">AUROVA</text>
  </g>

  <g id="crochet-hook" filter="url(#about-shadow)">
    <path d="M190 350 L470 210" stroke="#C4A47E" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 295 L360 265" stroke="#B08F68" stroke-width="11" stroke-linecap="round"/>
    <path d="M470 210 Q485 202 480 196 Q472 192 465 204" fill="none" stroke="#C4A47E" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <g id="bloom" transform="translate(450, 310)" filter="url(#about-shadow)">
    <circle cx="0" cy="0" r="26" fill="#FBF7F2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#D9B7B2" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="10" fill="#B98F8B"/>
  </g>

  <path d="M400 300 Q450 360 410 400 Q370 440 310 430 Q240 420 200 440" fill="none" stroke="#B98F8B" stroke-width="3" stroke-linecap="round"/>

  <path d="M220 370 Q160 380 130 430" fill="none" stroke="#7A8B76" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="140" cy="405" rx="14" ry="6" fill="#8A9A86" transform="rotate(30 140 405)"/>
  <ellipse cx="175" cy="380" rx="14" ry="6" fill="#A1B19D" transform="rotate(10 175 380)"/>

  <text x="50" y="505" font-family="'Cormorant Garamond', serif" font-size="14" fill="#3C332E" letter-spacing="2">AUROVA · L'ART DU CROCHET</text>
  <text x="50" y="522" font-family="'DM Sans', sans-serif" font-size="9" fill="#7A6D65" letter-spacing="1">ETUDE DES TEXTILES ET DU TEMPS</text>
  <rect x="20" y="20" width="660" height="510" fill="none" stroke="#3C332E" stroke-width="1" opacity="0.1"/>
</svg>