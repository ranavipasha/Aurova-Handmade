<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <filter id="ink-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111111" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="cherry-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="55%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </radialGradient>
    <radialGradient id="leaf-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="60%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
  </defs>

  <rect width="600" height="650" fill="#FFFFFF"/>

  <!-- Vintage studio circular stamp -->
  <g transform="translate(100, 150)" opacity="0.4">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="2 3"/>
    <text x="40" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" letter-spacing="1.5" fill="#222222" text-anchor="middle">AUROVA</text>
    <text x="40" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#222222" text-anchor="middle">CHARMS</text>
    <text x="40" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="1" fill="#222222" text-anchor="middle">HANDMADE</text>
  </g>

  <!-- CHUNKY CROCHET CHERRY & DAISY KEYCHAIN -->
  <g id="keychain" transform="translate(180, 80)" filter="url(#ink-shadow)">
    <!-- Golden Brass Split Keyring -->
    <circle cx="120" cy="80" r="42" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <circle cx="120" cy="80" r="33" fill="none" stroke="#9A7B1C" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="14" fill="none" stroke="#D4AF37" stroke-width="4"/>

    <!-- Green Stem Cord with ink outline -->
    <path d="M120 144 Q70 240 50 320" fill="none" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 144 Q170 240 190 320" fill="none" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 144 Q70 240 50 320" fill="none" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M120 144 Q170 240 190 320" fill="none" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Chunky Leaf with ink outlines -->
    <g transform="translate(130, 190)">
      <path d="M0 0 C40 -25, 70 -10, 75 25 C45 35, 15 20, 0 0 Z" 
            fill="url(#leaf-grad)" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 0 Q38 8 72 23" fill="none" stroke="#A5D6A7" stroke-width="2"/>
    </g>

    <!-- Left Chunky Cherry (Bobble Sphere) -->
    <g transform="translate(45, 340)">
      <circle cx="0" cy="0" r="50" fill="url(#cherry-grad)" stroke="#1A1A1A" stroke-width="2.8"/>
      <!-- Chunky bobble texture contours -->
      <path d="M-30 -15 C-20 -35, 20 -35, 30 -15 C40 10, 25 35, 0 38 C-25 35, -40 10, -30 -15 Z" 
            fill="none" stroke="#FF8A80" stroke-width="2" opacity="0.6"/>
      <circle cx="-15" cy="-15" r="14" fill="#FF8A80" opacity="0.65"/>
      <circle cx="-18" cy="-18" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Right Chunky Cherry (Bobble Sphere) -->
    <g transform="translate(195, 340)">
      <circle cx="0" cy="0" r="50" fill="url(#cherry-grad)" stroke="#1A1A1A" stroke-width="2.8"/>
      <path d="M-30 -15 C-20 -35, 20 -35, 30 -15 C40 10, 25 35, 0 38 C-25 35, -40 10, -30 -15 Z" 
            fill="none" stroke="#FF8A80" stroke-width="2" opacity="0.6"/>
      <circle cx="-15" cy="-15" r="14" fill="#FF8A80" opacity="0.65"/>
      <circle cx="-18" cy="-18" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Attached Chunky Crochet Daisy Charm -->
    <g transform="translate(120, 250)">
      <!-- Daisy petals with black ink outlines -->
      <g fill="#FFFDF8" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round">
        <ellipse cx="-20" cy="0" rx="16" ry="9"/>
        <ellipse cx="20" cy="0" rx="16" ry="9"/>
        <ellipse cx="0" cy="-20" rx="9" ry="16"/>
        <ellipse cx="0" cy="20" rx="9" ry="16"/>
        <ellipse cx="-14" cy="-14" rx="14" ry="8" transform="rotate(45 -14 -14)"/>
        <ellipse cx="14" cy="14" rx="14" ry="8" transform="rotate(45 14 14)"/>
        <ellipse cx="14" cy="-14" rx="14" ry="8" transform="rotate(-45 14 -14)"/>
        <ellipse cx="-14" cy="14" rx="14" ry="8" transform="rotate(-45 -14 14)"/>
      </g>
      <!-- Golden Pistil -->
      <circle cx="0" cy="0" r="13" fill="#FFB300" stroke="#1A1A1A" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="3" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>
</svg>