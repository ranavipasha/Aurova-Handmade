<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="100%" height="100%">
  <defs>
    <filter id="toy-sh" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3C332E" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="toys-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
