<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <filter id="c-sh" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="#FFFFFF"/>

  <!-- Playful stars & doodles -->
  <path d="M80 80 L90 100 L110 102 L95 115 L100 135 L80 122 L60 135 L65 115 L50 102 L70 100 Z" 
        fill="#FFCA28" stroke="#F57C00" stroke-width="1.8"/>
  <path d="M500 80 Q530 50 510 100 Q490 150 540 160" fill="none" stroke="#FFA726" stroke-width="5" stroke-linecap="round"/>

  <!-- ARTISAN CROCHET RAKHI & BESPOKE TALISMAN (Centerpiece) -->
  <g id="rakhi-illustration" transform="translate(100, 110)" filter="url(#c-sh)">
    <!-- Braided Silk & Golden Ties -->
    <path d="M0 140 C80 125, 140 155, 190 140" fill="none" stroke="#E91E63" stroke-width="4" stroke-linecap="round"/>
    <path d="M210 140 C260 125, 320 155, 400 140" fill="none" stroke="#E91E63" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 140 C80 125, 140 155, 190 140" fill="none" stroke="#FFD54F" stroke-width="1.8" stroke-dasharray="4 4"/>
    <path d="M210 140 C260 125, 320 155, 400 140" fill="none" stroke="#FFD54F" stroke-width="1.8" stroke-dasharray="4 4"/>

    <!-- Wooden & Golden Accent Beads -->
    <circle cx="90" cy="135" r="8" fill="#D4AF37" stroke="#8E6516" stroke-width="1.5"/>
    <circle cx="130" cy="145" r="7" fill="#FAF4EF" stroke="#BCAAA4" stroke-width="1.5"/>
    <circle cx="270" cy="135" r="7" fill="#FAF4EF" stroke="#BCAAA4" stroke-width="1.5"/>
    <circle cx="310" cy="145" r="8" fill="#D4AF37" stroke="#8E6516" stroke-width="1.5"/>

    <!-- Central Crochet Medallion -->
    <circle cx="200" cy="140" r="55" fill="#FAF4EF" stroke="#C2185B" stroke-width="2.5"/>
    <!-- Scalloped crochet outer border -->
    <circle cx="200" cy="140" r="55" fill="none" stroke="#E91E63" stroke-width="5" stroke-dasharray="6 6"/>
    <!-- Mid ring in soft rose -->
    <circle cx="200" cy="140" r="40" fill="#F8BBD0" stroke="#C2185B" stroke-width="1.5"/>
    <!-- Inner flower in cream -->
    <circle cx="200" cy="140" r="26" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.5"/>
    <!-- Center Golden Pistil -->
    <circle cx="200" cy="140" r="14" fill="#FFD54F" stroke="#FFA000" stroke-width="2"/>
    <circle cx="200" cy="140" r="6" fill="#E65100"/>

    <!-- Tassel ends -->
    <path d="M0 140 L-25 130 M0 140 L-28 140 M0 140 L-25 150" stroke="#E91E63" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M400 140 L425 130 M400 140 L428 140 M400 140 L425 150" stroke="#E91E63" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Palette Swatches & Sketch Doodle at Bottom -->
  <g transform="translate(180, 340)" filter="url(#c-sh)">
    <rect x="0" y="0" width="240" height="45" rx="10" fill="#FBFBFB" stroke="#E0E0E0" stroke-width="1.5"/>
    <circle cx="35" cy="22" r="12" fill="#E53935"/>
    <circle cx="75" cy="22" r="12" fill="#F48FB1"/>
    <circle cx="115" cy="22" r="12" fill="#FFCA28"/>
    <circle cx="155" cy="22" r="12" fill="#81C784"/>
    <circle cx="195" cy="22" r="12" fill="#4A4A4A"/>
  </g>
</svg>