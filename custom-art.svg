    <text x="440" y="215" font-family="'Cormorant Garamond', serif" font-size="14" fill="#3C332E" letter-spacing="1">VOTRE IDÉE, PAS À PAS</text>
    <circle cx="535" cy="310" r="50" fill="#F4E9DF"/>
    <circle cx="535" cy="310" r="50" fill="none" stroke="#B98F8B" stroke-width="3" stroke-dasharray="5 5"/>
    <circle cx="535" cy="310" r="30" fill="#D9B7B2"/>
    <circle cx="535" cy="310" r="14" fill="#FAF5EE"/>
