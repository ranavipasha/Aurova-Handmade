<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="100%" height="100%">
  <defs>
    <!-- Colored pencil texture filter -->
    <filter id="pencil-texture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.15  0 0 0 0 0.15  0 0 0 0.04 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise"/>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="doodle-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.08"/>
    </filter>

    <radialGradient id="egg-yolk" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="70%" stop-color="#FF9E1B"/>
      <stop offset="100%" stop-color="#E87B00"/>
    </radialGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="850" height="650" fill="#FFFFFF"/>

  <!-- PLAYFUL FLOATING HAND-DRAWN DOODLES (Inspired by reference art) -->
  
  <!-- Hand-drawn Golden Star (Top Left) -->
  <path d="M140 90 L155 125 L192 128 L163 152 L172 188 L140 168 L108 188 L117 152 L88 128 L125 125 Z" 
        fill="#FFD24C" stroke="#E59819" stroke-width="2.5" stroke-linejoin="round" opacity="0.9" filter="url(#doodle-shadow)"/>
  <!-- Star pencil inner hatch lines -->
  <path d="M125 130 L155 155 M140 110 L140 170 M115 160 L165 135" stroke="#E59819" stroke-width="1.5" opacity="0.6"/>

  <!-- Cut Passion Fruit Doodle (Top-mid) -->
  <g transform="translate(240, 75)" filter="url(#doodle-shadow)">
    <circle cx="28" cy="28" r="26" fill="#843B62" stroke="#5E2243" stroke-width="2"/>
    <circle cx="28" cy="28" r="21" fill="#FFD152"/>
    <!-- Seeds -->
    <circle cx="22" cy="22" r="3" fill="#3D1D2E"/>
    <circle cx="34" cy="20" r="3" fill="#3D1D2E"/>
    <circle cx="28" cy="30" r="3" fill="#3D1D2E"/>
    <circle cx="20" cy="32" r="2.5" fill="#3D1D2E"/>
    <circle cx="35" cy="33" r="2.5" fill="#3D1D2E"/>
  </g>

  <!-- Realistic Sunny Fried Egg (Top Right) -->
  <g transform="translate(680, 110)" filter="url(#doodle-shadow)">
    <!-- Egg white with wavy organic edge -->
    <path d="M40 10 C65 8, 85 22, 88 45 C92 68, 75 88, 50 86 C25 84, 10 72, 8 50 C6 28, 20 12, 40 10 Z" 
          fill="#F7F7F7" stroke="#E0DACB" stroke-width="2.5"/>
    <path d="M42 16 C60 14, 78 26, 80 44 C82 62, 70 78, 50 76 C30 74, 18 64, 16 48 C14 30, 26 18, 42 16 Z" 
          fill="#FFFFFF"/>
    <!-- Golden Yolk -->
    <circle cx="48" cy="48" r="19" fill="url(#egg-yolk)"/>
    <circle cx="43" cy="42" r="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Golden Ferrero Rocher sweet (Right) -->
  <g transform="translate(710, 260)" filter="url(#doodle-shadow)">
    <circle cx="30" cy="30" r="24" fill="#C99738" stroke="#8E6516" stroke-width="2"/>
    <!-- Textured gold foil pattern -->
    <path d="M12 30 Q30 12 48 30 Q30 48 12 30" fill="none" stroke="#FCE28A" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="16" fill="#84532B"/>
    <rect x="18" y="24" width="24" height="12" rx="3" fill="#FFFFFF" stroke="#C99738" stroke-width="1"/>
    <text x="30" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#84532B" text-anchor="middle">AUROVA</text>
  </g>

  <!-- Playful Yellow Loop-de-Loop Swirl (Right) -->
  <path d="M660 210 Q690 180 670 230 Q650 280 700 290" 
        fill="none" stroke="#FFA726" stroke-width="7" stroke-linecap="round"/>

  <!-- Hand-drawn Star (Mid Right) -->
  <path d="M720 400 L730 425 L755 428 L735 445 L742 470 L720 455 L698 470 L705 445 L685 428 L710 425 Z" 
        fill="#FFCA28" stroke="#F57C00" stroke-width="2" opacity="0.9"/>

  <!-- Orange Juice with Mint & Citrus Slice (Bottom Right) -->
  <g transform="translate(640, 470)" filter="url(#doodle-shadow)">
    <!-- Glass with orange drink -->
    <rect x="16" y="20" width="40" height="60" rx="6" fill="#FFA726" stroke="#E65100" stroke-width="2"/>
    <rect x="20" y="24" width="14" height="52" fill="#FFB74D" opacity="0.7"/>
    <!-- Mint leaves -->
    <path d="M26 18 C20 10 32 4 36 14 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
    <!-- Orange wheel slice -->
    <circle cx="16" cy="65" r="16" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <circle cx="16" cy="65" r="12" fill="#FFE0B2"/>
    <circle cx="16" cy="65" r="3" fill="#FF9800"/>
  </g>

  <!-- Blue Action Rays / Sparkles (Left) -->
  <path d="M220 180 L200 155 M240 170 L235 140 M265 185 L285 160" stroke="#42A5F5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Pink & Teal Hand-drawn Letter Block "A" -->
  <g transform="translate(180, 230)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#EC407A" stroke="#C2185B" stroke-width="2"/>
    <path d="M0 34 L8 42 L42 42 L34 34 Z" fill="#26A69A"/>
    <path d="M34 0 L42 8 L42 42 L34 34 Z" fill="#00897B"/>
    <text x="17" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <!-- ============================================================== -->
  <!-- CENTERPIECE: CHARMING CURLY-HAIRED ARTISAN & HANDMADE CROCHET -->
  <!-- ============================================================== -->
  
  <g id="artisan-girl" transform="translate(300, 140)">
    
    <!-- Big Voluminous Curly Hair (Left & Back) -->
    <!-- Curly clusters with colored-pencil texture -->
    <g fill="#2B2625" stroke="#1A1716" stroke-width="2">
      <!-- Outer curls -->
      <circle cx="60" cy="180" r="55"/>
      <circle cx="40" cy="240" r="60"/>
      <circle cx="55" cy="310" r="65"/>
      <circle cx="80" cy="380" r="60"/>
      <circle cx="120" cy="440" r="55"/>
      <circle cx="220" cy="450" r="50"/>
      <circle cx="280" cy="430" r="55"/>
      <circle cx="330" cy="380" r="60"/>
      <circle cx="345" cy="300" r="60"/>
      <circle cx="330" cy="220" r="55"/>
      <circle cx="290" cy="160" r="50"/>
      <circle cx="220" cy="130" r="55"/>
      <circle cx="150" cy="135" r="55"/>
      <circle cx="100" cy="150" r="50"/>
    </g>

    <!-- Hair highlights & individual curly coils -->
    <g fill="none" stroke="#4A403D" stroke-width="3" stroke-linecap="round">
      <path d="M70 170 Q50 200 80 230 Q60 260 90 290 Q70 330 100 360"/>
      <path d="M45 220 Q25 250 55 280 Q35 310 65 340"/>
      <path d="M310 180 Q330 220 300 250 Q330 280 300 320 Q330 350 305 390"/>
      <path d="M335 240 Q355 280 325 310 Q350 340 320 370"/>
    </g>

    <!-- Warm Cozy Textured Sweater -->
    <path d="M120 390 C90 420 80 500 80 520 L320 520 C320 500 310 420 280 390 Z" 
          fill="#333333" stroke="#1F1F1F" stroke-width="2"/>
    <path d="M120 390 C160 410 240 410 280 390 C260 430 140 430 120 390 Z" 
          fill="#4A4A4A"/>

    <!-- Neck & Face -->
    <path d="M170 340 L170 400 C170 415 230 415 230 400 L230 340 Z" fill="#FADBC8"/>
    <!-- Tiny necklace with heart pendant -->
    <path d="M180 380 Q200 395 220 380" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="200" cy="392" r="2.5" fill="#E91E63"/>

    <!-- Cute Round Face -->
    <ellipse cx="200" cy="270" rx="72" ry="76" fill="#FFE5D4" stroke="#F5CBA7" stroke-width="1.5"/>

    <!-- Sweet Blush Cheeks -->
    <ellipse cx="150" cy="295" rx="14" ry="9" fill="#FF8A80" opacity="0.65"/>
    <ellipse cx="250" cy="295" rx="14" ry="9" fill="#FF8A80" opacity="0.65"/>

    <!-- Expressive Big Eyes (Looking Wonderfully Upward/Curious like reference) -->
    <!-- Left Eye -->
    <ellipse cx="165" cy="260" rx="14" ry="17" fill="#212121"/>
    <circle cx="160" cy="254" r="5" fill="#FFFFFF"/>
    <circle cx="170" cy="266" r="2.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="235" cy="260" rx="14" ry="17" fill="#212121"/>
    <circle cx="230" cy="254" r="5" fill="#FFFFFF"/>
    <circle cx="240" cy="266" r="2.5" fill="#FFFFFF"/>

    <!-- Cute Eyelashes -->
    <path d="M152 248 Q165 240 178 248" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
    <path d="M222 248 Q235 240 248 248" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>

    <!-- Cute Little Button Nose -->
    <path d="M196 276 Q200 282 204 276" fill="none" stroke="#D78A76" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sweet Coral Rose Lips -->
    <ellipse cx="200" cy="298" rx="8" ry="5" fill="#E57373"/>
    <path d="M194 298 Q200 302 206 298" fill="none" stroke="#C62828" stroke-width="1.5"/>

    <!-- Forehead Curls / Bangs -->
    <path d="M140 210 Q170 230 190 205 Q210 235 240 210 Q260 230 270 215" 
          fill="none" stroke="#2B2625" stroke-width="12" stroke-linecap="round"/>

    <!-- THE HANDMADE CROCHET TOTE BAG HELD IN FRONT -->
    <g id="crochet-bag" transform="translate(105, 360)" filter="url(#doodle-shadow)">
      <!-- Shoulder Strap -->
      <path d="M20 20 Q-10 -70 50 -60 Q110 -50 90 20" fill="none" stroke="#8D6E63" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 20 Q-10 -70 50 -60 Q110 -50 90 20" fill="none" stroke="#D7CCC8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
      
      <!-- Bag Body: Warm cream crochet texture -->
      <rect x="10" y="20" width="100" height="95" rx="14" fill="#F5EBE6" stroke="#8D6E63" stroke-width="2.5"/>
      <!-- Grid crochet stitches -->
      <g stroke="#C7B198" stroke-width="1.8" stroke-dasharray="3 4">
        <line x1="10" y1="40" x2="110" y2="40"/><line x1="10" y1="60" x2="110" y2="60"/>
        <line x1="10" y1="80" x2="110" y2="80"/><line x1="10" y1="100" x2="110" y2="100"/>
        <line x1="30" y1="20" x2="30" y2="115"/><line x1="50" y1="20" x2="50" y2="115"/>
        <line x1="70" y1="20" x2="70" y2="115"/><line x1="90" y1="20" x2="90" y2="115"/>
      </g>

      <!-- Attached Crochet Daisy on bag -->
      <circle cx="60" cy="65" r="14" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="1.5"/>
      <circle cx="60" cy="65" r="7" fill="#FFCA28"/>
      
      <!-- Hanging Cherry Charm -->
      <path d="M85 35 Q95 50 100 65" fill="none" stroke="#4CAF50" stroke-width="2"/>
      <circle cx="95" cy="68" r="7" fill="#E53935"/>
      <circle cx="106" cy="66" r="6" fill="#C62828"/>
    </g>

    <!-- Ball of Yarn with Crochet Hook (Matching Aurova Logo Concept) -->
    <g id="yarn-ball" transform="translate(195, 380)" filter="url(#doodle-shadow)">
      <circle cx="35" cy="35" r="28" fill="#E0E0E0" stroke="#4A4A4A" stroke-width="2.5"/>
      <!-- Yarn wound lines -->
      <path d="M15 35 C20 18, 50 18, 55 35 C50 52, 20 52, 15 35" fill="none" stroke="#757575" stroke-width="2"/>
      <path d="M25 15 C40 22, 40 48, 25 55" fill="none" stroke="#757575" stroke-width="2"/>
      <path d="M45 15 C30 22, 30 48, 45 55" fill="none" stroke="#757575" stroke-width="2"/>
      <!-- Wooden crochet hook through yarn -->
      <line x1="5" y1="65" x2="70" y2="5" stroke="#A1887F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="70" cy="5" r="3" fill="#5D4037"/>
    </g>
  </g>

  <!-- Sweet hand-drawn crochet flowers floating on left -->
  <g transform="translate(120, 360)" filter="url(#doodle-shadow)">
    <!-- Crochet Rose -->
    <circle cx="30" cy="30" r="22" fill="#F48FB1" stroke="#C2185B" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#F06292"/>
    <circle cx="30" cy="30" r="7" fill="#FFFFFF"/>
    <path d="M30 52 Q25 90 20 120" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="14" cy="85" rx="10" ry="5" fill="#81C784" transform="rotate(-30 14 85)"/>
  </g>

  <g transform="translate(180, 440)" filter="url(#doodle-shadow)">
    <!-- Crochet Daisy -->
    <circle cx="20" cy="20" r="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <circle cx="20" cy="20" r="8" fill="#FFD54F"/>
    <path d="M20 36 Q22 65 24 95" stroke="#66BB6A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>