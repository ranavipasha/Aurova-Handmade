  <text x="300" y="560" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="15" fill="#3C332E" letter-spacing="3">AUROVA BOTANICA · ÉDITION FLORALE</text>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#3C332E" stroke-width="1" opacity="0.15"/>
</svg>