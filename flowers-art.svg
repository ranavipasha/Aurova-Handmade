<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="fl-sh" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3C332E" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EFE6D9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#fl-bg)"/>
  <circle cx="180" cy="220" r="120" fill="#D9B7B2" opacity="0.22"/>
  <circle cx="420" cy="380" r="130" fill="#8A9A86" opacity="0.2"/>

  <line x1="300" y1="40" x2="300" y2="520" stroke="#3C332E" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.2"/>
  <line x1="40" y1="280" x2="560" y2="280" stroke="#3C332E" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.2"/>

  <g transform="translate(170, 160)" filter="url(#fl-sh)">
    <path d="M0 45 Q5 80 -10 110" fill="none" stroke="#7E8F7A" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-12" cy="75" rx="12" ry="5" fill="#8A9A86" transform="rotate(-30 -12 75)"/>
    <circle cx="0" cy="0" r="38" fill="#B98F8B"/>
    <circle cx="0" cy="0" r="32" fill="#D9B7B2"/>
    <circle cx="0" cy="0" r="22" fill="#FAF4EE"/>
    <circle cx="0" cy="0" r="12" fill="#B98F8B"/>
    <circle cx="0" cy="0" r="6" fill="#3C332E"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FAF4EE" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text x="0" y="65" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="12" fill="#3C332E">Fig. 1 — Rose de Coton</text>
  </g>

  <g transform="translate(430, 150)" filter="url(#fl-sh)">
    <path d="M0 -40 V 120" stroke="#7E8F7A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-7" cy="-30" rx="9" ry="6" fill="#B98F8B" transform="rotate(-20 -7 -30)"/>
    <ellipse cx="7" cy="-24" rx="9" ry="6" fill="#C59E9A" transform="rotate(20 7 -24)"/>
    <ellipse cx="-8" cy="-14" rx="10" ry="7" fill="#B98F8B" transform="rotate(-20 -8 -14)"/>
    <ellipse cx="8" cy="-8" rx="10" ry="7" fill="#C59E9A" transform="rotate(20 8 -8)"/>
    <ellipse cx="-9" cy="4" rx="11" ry="8" fill="#D9B7B2" transform="rotate(-20 -9 4)"/>
    <ellipse cx="9" cy="10" rx="11" ry="8" fill="#B98F8B" transform="rotate(20 9 10)"/>
    <ellipse cx="15" cy="80" rx="14" ry="4" fill="#8A9A86" transform="rotate(40 15 80)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="12" fill="#3C332E">Fig. 2 — Brin de Lavande</text>
  </g>

  <g transform="translate(170, 400)" filter="url(#fl-sh)">
    <path d="M0 30 Q-10 65 -5 100" fill="none" stroke="#7E8F7A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-15" cy="0" rx="16" ry="7" fill="#FFFFFF"/>
    <ellipse cx="15" cy="0" rx="16" ry="7" fill="#FFFFFF"/>
    <ellipse cx="0" cy="-15" rx="7" ry="16" fill="#FFFFFF"/>
    <ellipse cx="0" cy="15" rx="7" ry="16" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="11" fill="#D4A76A"/>
    <circle cx="0" cy="0" r="7" fill="#B88A4F"/>
    <text x="0" y="65" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="12" fill="#3C332E">Fig. 3 — Camomille Blanche</text>
  </g>

  <g transform="translate(430, 390)" filter="url(#fl-sh)">
    <path d="M0 50 Q10 10 -20 -15" fill="none" stroke="#7E8F7A" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M-20 -15 C-45 -20, -55 15, -35 30 C-15 45, 10 25, -5 5 Z" fill="#D9B7B2"/>
    <path d="M-15 -10 C-35 -15, -45 12, -30 22 C-15 32, 5 18, -5 5 Z" fill="#B98F8B"/>
